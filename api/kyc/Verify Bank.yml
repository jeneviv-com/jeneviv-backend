info:
  name: Verify Bank
  type: http
  seq: 3

http:
  method: POST
  url: "{{api}}/api/merchants/me/kyc/bank"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"
  body:
    type: json
    data: |-
      {
        "bank_code": "058",
        "account_number": "0123456789"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
