info:
  name: Set Treasurer
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{api}}/api/merchants/me/treasurer"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"
  body:
    type: json
    data: |-
      {
        "treasurer_name": "Mrs Adeyemi",
        "treasurer_phone": "08031234567"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
