info:
  name: Verify NIN
  type: http
  seq: 2

http:
  method: POST
  url: "{{api}}/api/merchants/me/kyc/nin"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"
  body:
    type: json
    data: |-
      {
        "nin": "70123456789"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const k = res.body && res.body.kyc;

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
