info:
  name: Update Template
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{api}}/api/templates/{{template_id}}"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"
  body:
    type: json
    data: |-
      {
        "description": "Updated description"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
