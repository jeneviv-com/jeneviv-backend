info:
  name: List Templates
  type: http
  seq: 1

http:
  method: GET
  url: "{{api}}/api/templates?scope=all"
  params:
    - name: scope
      value: all
      type: query
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
