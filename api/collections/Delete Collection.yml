info:
  name: Delete Collection
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{api}}/api/collections/{{collection_id}}"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
