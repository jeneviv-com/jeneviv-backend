info:
  name: Get My Merchant
  type: http
  seq: 2

http:
  method: GET
  url: "{{api}}/api/merchants/me"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

