info:
  name: Add Bank Account
  type: http
  seq: 5

http:
  method: POST
  url: "{{api}}/api/merchants/me/bank-accounts"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"
  body:
    type: json
    data: |-
      {
        "bank_code": "999992",
        "account_number": "8165620409",
        "currency": "NGN",
        "is_default": true
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const created = res.body && res.body.bank_account;
        if (created && created.id) bru.setEnvVar("bank_account_id", created.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{api}}/api/merchants/me/bank-accounts"
      method: POST
      headers:
        - name: Cookie
          value: "{{session_cookie}}"
        - name: Origin
          value: "{{api}}"
      body:
        type: json
        data: |-
          {
            "bank_code": "999992",
            "account_number": "8165620409",
            "currency": "NGN",
            "is_default": true
          }
