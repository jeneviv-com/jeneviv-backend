info:
  name: Retry Refund
  type: http
  seq: 2

http:
  method: POST
  url: "{{api}}/api/refunds/{{refund_id}}/retry"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"
  body:
    type: json
    data: |-
      {
        "account_number": "0123456789",
        "bank_code": "058"
      }

runtime:
  variables:
    - name: refund_id
      value: replace-with-refund-id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
