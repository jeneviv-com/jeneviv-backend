info:
  name: List Refunds
  type: http
  seq: 1

http:
  method: GET
  url: "{{api}}/api/refunds"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns refunds", function () {
          expect(res.status).to.equal(200);
          expect(res.body.refunds).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
