info:
  name: Get Transaction
  type: http
  seq: 1

http:
  method: GET
  url: "{{api}}/api/transactions/{{transaction_id}}"
  headers:
    - name: Cookie
      value: "{{session_cookie}}"
    - name: Origin
      value: "{{api}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
