    request:
      url: "{{api}}/api/auth/sign-up/email"
      method: POST
      headers:
        - name: Origin
          value: "{{api}}"
      body:
        type: json
        data: |-
          {
            "name": "{{auth_name}}",
            "email": "{{auth_email}}",
